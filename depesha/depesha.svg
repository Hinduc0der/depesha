<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
<!--
  Депеша: срочное сообщение по телеграфу, слово из позапрошлого века.

  Телеграфный бланк с оборванным краем, текст на нём морзянкой, в углу
  сургучная печать. Шутка ровно та, ради которой всё и затевалось: клиент
  Telegram для телефона 2007 года выглядит как депеша с телеграфа, потому что
  по нынешним меркам он ею и является.

  Нарисовано плоскими заливками без градиентов, прозрачности и текстовых
  элементов: Symbian рисует иконку своим SVG-T, и всё сложнее простых фигур
  он либо не поймёт, либо нарисует не так.
  (И да, двойной дефис внутри XML-комментария недопустим. Проверено.)
-->
<path fill="#2E3A46" d="M100,20 h300 a80,80 0 0 1 80,80 v300 a80,80 0 0 1 -80,80 h-300 a80,80 0 0 1 -80,-80 v-300 a80,80 0 0 1 80,-80 z"/>
<g transform="rotate(-6 250 250)">
  <!-- бланк с оборванным нижним краем -->
  <path fill="#EFE3C8" d="M104,92 h292 v252 l-26,16 l-26,-16 l-26,16 l-26,-16 l-26,16 l-26,-16 l-26,16 l-26,-16 l-26,16 l-26,-16 l-26,16 v-268 z"/>
  <!-- морзянка, строка за строкой: ДЕ, ПЕ, ША -->
  <rect fill="#4A4035" x="134" y="140" width="30" height="15"/>
  <rect fill="#4A4035" x="174" y="140" width="13" height="15"/>
  <rect fill="#4A4035" x="197" y="140" width="13" height="15"/>
  <rect fill="#4A4035" x="236" y="140" width="13" height="15"/>
  <rect fill="#4A4035" x="134" y="182" width="13" height="15"/>
  <rect fill="#4A4035" x="157" y="182" width="30" height="15"/>
  <rect fill="#4A4035" x="197" y="182" width="30" height="15"/>
  <rect fill="#4A4035" x="237" y="182" width="13" height="15"/>
  <rect fill="#4A4035" x="276" y="182" width="13" height="15"/>
  <rect fill="#4A4035" x="134" y="224" width="30" height="15"/>
  <rect fill="#4A4035" x="174" y="224" width="30" height="15"/>
  <rect fill="#4A4035" x="214" y="224" width="30" height="15"/>
  <rect fill="#4A4035" x="254" y="224" width="30" height="15"/>
  <rect fill="#4A4035" x="310" y="224" width="13" height="15"/>
  <rect fill="#4A4035" x="333" y="224" width="30" height="15"/>
  <!-- сургучная печать -->
  <circle fill="#B5342C" cx="352" cy="318" r="58"/>
  <circle fill="#8E2820" cx="352" cy="318" r="38"/>
  <path fill="#EFE3C8" d="M320,314 L389,290 L367,350 L352,330 L320,314 Z"/>
</g>
</svg>
